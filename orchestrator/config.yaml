workers:
  count: 4
  default_timeout: 300

queue:
  backend: memory
  redis_url: redis://localhost:6379/0

soar:
  workflows_dir: /app/soar/workflows
  connectors_dir: /app/soar/connectors
  actions_dir: /app/soar/actions
  state_dir: /app/soar/state

git:
  workflows_repo: /app/soar
  author_name: SOAR Orchestrator
  author_email: soar@local

logging:
  level: INFO
  file: /var/log/soar/orchestrator.log

jobs:
  log_dir: /var/log/soar/jobs
  keep_completed: 1000

server:
  trusted_proxies: []  # set to ["127.0.0.1"] when running behind nginx in same container

egress:
  mode: allowlist   # allowlist (default) | observe — see soar/egress_policy.py
  allow: []
    # Exceptions carved out of deny-private, not a replacement for the whole
    # policy — public internet stays reachable regardless of this list.
    # CIDR or single IP, e.g.:
    #   - 192.168.1.0/24   # internal SOC segment
    #   - 10.20.0.0/16
    #   - 127.0.0.1/32     # only if a workflow needs to reach a sidecar
    # WARNING: do not add 169.254.0.0/16 (or 169.254.169.254/32 specifically)
    # unless you mean it — that range includes cloud metadata endpoints
    # (AWS/GCP/Azure instance credentials).
